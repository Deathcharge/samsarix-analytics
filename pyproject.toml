[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-analytics"
version = "0.2.0"
description = "Bounded in-process metrics and threshold alerting for Python applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
authors = [
    {name = "Samsarix LLC", email = "contact@samsarix.com"}
]
maintainers = [
    {name = "Samsarix Support", email = "support@samsarix.com"}
]
keywords = ["alerting", "metrics", "monitoring", "prometheus", "samsarix", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.5,<2",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "twine>=6.2,<7",
]

[project.scripts]
samsarix-analytics = "samsarix_analytics.cli:main"

[project.urls]
Homepage = "https://www.samsarix.com"
Repository = "https://github.com/Deathcharge/samsarix-analytics"
Issues = "https://github.com/Deathcharge/samsarix-analytics/issues"
Changelog = "https://github.com/Deathcharge/samsarix-analytics/blob/main/CHANGELOG.md"
Licensing = "https://github.com/Deathcharge/samsarix-analytics/blob/main/LICENSING.md"
Support = "https://github.com/Deathcharge/samsarix-analytics/issues"

[tool.setuptools.packages.find]
include = ["samsarix_analytics*"]

[tool.setuptools.package-data]
samsarix_analytics = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["samsarix_analytics"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
